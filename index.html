<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Generator QR Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Librărie QRCodeJS -->
    <script src="js/qrcode.min.js"></script>

    <!-- jsPDF (pentru PDF) -->
    <script src="js/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="header">
        <h1>Generator QR Premium</h1>
        <p>Creează coduri QR profesionale pentru branduri, produse și evenimente.</p>
    </header>

    <div class="main-layout">

        <!-- PANOU SETĂRI (STÂNGA) -->
        <section class="settings-panel">

            <!-- SETĂRI DE BAZĂ -->
            <div class="settings-group">
                <h2>Setări de bază</h2>

                <label>Text sau URL</label>
                <input id="qr-input" type="text">

                <label>Culoare QR</label>
                <input id="qr-color" type="color">

                <label>Culoare fundal</label>
                <input id="bg-color" type="color">

                <label>Dimensiune (px)</label>
                <input id="qr-size" type="number" min="100" max="1000">

                <button id="generate-btn">Generează QR</button>
            </div>

            <!-- LOGO -->
            <div class="settings-group">
                <h2>Logo</h2>

                <label>Logo (PNG/JPG)</label>
                <input id="logo-input" type="file" accept="image/*">
                <button id="clear-logo-btn">Șterge logo</button>

                <label>Rotire logo (°)</label>
                <input id="logo-rotate" type="range" min="0" max="360">

                <label>Transparență logo (%)</label>
                <input id="logo-opacity" type="range" min="0" max="100">

                <label>Mărime logo (%)</label>
                <input id="logo-scale" type="range" min="10" max="100">

                <label>Poziție logo</label>
                <select id="logo-position">
                    <option value="centru">Centru</option>
                    <option value="top">Sus</option>
                    <option value="bottom">Jos</option>
                    <option value="left">Stânga</option>
                    <option value="right">Dreapta</option>
                </select>
            </div>

            <!-- EFECTE PREMIUM -->
            <div class="settings-group">
                <h2>Efecte Premium</h2>

                <label>Gradient QR</label>
                <select id="gradient-enable">
                    <option value="none">Fără</option>
                    <option value="linear">Linear</option>
                </select>

                <label>Gradient culoare 1</label>
                <input id="gradient-color1" type="color">

                <label>Gradient culoare 2</label>
                <input id="gradient-color2" type="color">

                <label>Culoare margine</label>
                <input id="border-color" type="color">

                <label>Grosime margine (px)</label>
                <input id="border-size" type="number" min="0" max="50">
            </div>

        </section>

        <!-- PREVIEW QR (DREAPTA) -->
        <section class="preview-panel">
            <div id="qrcode" class="qr-preview"></div>

            <div class="export-buttons">
                <button id="download-btn" disabled>Descarcă PNG</button>
                <button id="pdf-btn" disabled>Export PDF</button>
                <button id="svg-btn" disabled>Export SVG</button>
            </div>
        </section>

    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>Contact: laurentiu@example.com</p>
        <p>WhatsApp: 07xx xxx xxx</p>
    </footer>

</div>

<!-- SCRIPT JS -->
<script src="script.js"></script>

</body>
</html>
